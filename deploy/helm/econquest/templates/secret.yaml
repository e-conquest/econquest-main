{{- if and (not .Values.secret.existingSecret) .Values.secret.values }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "econquest.fullname" . }}
  labels:
    {{- include "econquest.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secret.values }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
