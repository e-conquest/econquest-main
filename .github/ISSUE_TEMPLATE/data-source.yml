name: Data source broke or is wrong
description: A source fails, returns a wrong figure, or its terms have changed
labels: [data-source]
body:
  - type: input
    id: source
    attributes:
      label: Source
      placeholder: e.g. BIS policy rates
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What is wrong
      description: Paste the line from `npm run check:data` or Menu > Data health, or the figure and what the official source shows (with a link).
    validations:
      required: true
